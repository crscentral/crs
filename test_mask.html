<!DOCTYPE html>
<html>
<head>
<style>
.logo {
    width: 350px;
    height: 181px;
    background-color: red; /* to see it */
    -webkit-mask-image: url('assets/images/logo_globe_transparent.webp');
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-image: url('assets/images/logo_globe_transparent.webp');
    mask-size: contain;
    mask-repeat: no-repeat;
    
    /* hide the actual image */
    object-position: -9999px;
}
</style>
</head>
<body style="background: black;">
    <img src="assets/images/logo_globe_transparent.webp" class="logo">
</body>
</html>
